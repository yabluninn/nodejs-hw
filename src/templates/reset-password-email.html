<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reset your password</title>
  </head>
  <body style="font-family: Arial, sans-serif">
    <h2>Hello, {{name}}!</h2>
    <p>We received a request to reset your password.</p>
    <p>
      Click the button below to set a new password (link valid for 15 minutes):
    </p>
    <p>
      <a
        href="{{link}}"
        style="
          display: inline-block;
          background: #4f46e5;
          color: #fff;
          padding: 10px 16px;
          text-decoration: none;
          border-radius: 6px;
        "
      >
        Reset password
      </a>
    </p>
    <p>If you didn’t request this, just ignore this email.</p>
  </body>
</html>
